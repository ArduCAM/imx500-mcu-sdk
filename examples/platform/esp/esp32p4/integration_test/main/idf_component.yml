dependencies:
  idf: ">=5.5"
  espressif/esp_video:
    version: "^2.0.0"
  esp_cam_sensor:
    override_path: "../esp_cam_sensor"
  example_video_common:
    override_path: "../components/example_video_common"
  protocol_examples_common:
    path: ${IDF_PATH}/examples/common_components/protocol_examples_common
  espressif/mdns:
    version: "^1.0.3"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/cjson:
    version: "^1.7.19"
    rules:
      - if: "idf_version >= 6.0"
  lcd:
    override_path: "../components/lcd"
  drawing_utils:
    override_path: "../components/drawing_utils"